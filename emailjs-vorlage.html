<div style="background:#eef1f7;padding:28px 12px;font-family:'Segoe UI',Arial,Helvetica,sans-serif">
  <div style="display:none;max-height:0;overflow:hidden">{{subject}}</div>
  <div style="max-width:580px;margin:0 auto">
    <div style="background:#061025;border-radius:16px 16px 0 0;padding:22px 28px">
      <table role="presentation" style="border-collapse:collapse"><tr>
        <td style="vertical-align:middle;padding-right:14px">
          <div style="width:44px;height:44px;border-radius:12px;background:#D6C28C;color:#061025;font-weight:bold;font-size:18px;line-height:44px;text-align:center">PW</div>
        </td>
        <td style="vertical-align:middle">
          <div style="color:#D6C28C;font-size:20px;font-weight:bold;letter-spacing:.3px">Pausen Workout</div>
          <div style="color:#9FB0D0;font-size:13px">Body Activity App</div>
        </td>
      </tr></table>
    </div>
    <div style="height:4px;background:#D6C28C"></div>
    <div style="background:#ffffff;padding:28px;color:#1c2333;font-size:15px;line-height:1.6;border-left:1px solid #e3e7f0;border-right:1px solid #e3e7f0">
      {{{message}}}
      <p style="margin:28px 0 10px">
        <a href="{{button_url}}" style="display:inline-block;background:#061025;color:#D6C28C;text-decoration:none;font-weight:bold;padding:14px 26px;border-radius:10px;letter-spacing:.4px">{{button_text}}</a>
      </p>
      <p style="font-size:12px;color:#8a93a8;margin:0">Button funktioniert nicht? Diesen Link öffnen:<br><a href="{{button_url}}" style="color:#5a6788;word-break:break-all">{{button_url}}</a></p>
      <p style="margin:26px 0 0">Sportliche Grüße<br><b>Dein Pausen Workout Team</b></p>
    </div>
    <div style="background:#f7f8fb;border:1px solid #e3e7f0;border-top:0;border-radius:0 0 16px 16px;padding:20px 28px">
      {{{footer}}}
    </div>
  </div>
</div>
